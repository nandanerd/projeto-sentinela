<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../css/style.css">
<title>Triagem</title>
<style>
  .btn-tv {
    background-color: greenyellow;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-left: 8px;

  }

  .btn-tv:hover{
    background-color: #1e7e342f;
  }

  .paciente-fila{
    margin-bottom: 30px;
    background: #f0f4ff;
    border-radius: 8px;
    padding: 16px;
    border: 1px solid #d0d8f0;

  }

  .paciente-fila h3{
    margin-top: 0;
    color: #333;
    display: flex;
justify-content: space-between;
align-items: center;
  }

  .paciente-fila h3 span{
font-size: 13px;
font-weight: normal;
color: #666;

  }

  .fila-item{
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid white;
  }

  .fila-item strong { font-size: 15px;}
  .fila-item small{ color: #888;
  font-size: 12px;}

  .btn-abrir-tv{
    display: inline-block;
    background: #17a2b8;
    color: white;
    padding: 8px 14px;
    border-radius: 5px;
    font-size: 14px;
    text-decoration:none;
    cursor: pointer;
    border: none;
  }

  .btn-abrir-tv:hover{
    background: #17a2b8;
    
  }

</style>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
  <!-- Cabeça com botão da TV -->
   <div style="display:flex; justify-content:space-between;
   align-items:center; margin-bottom: 20px;">
   <h2 style="margin:0"> 🏥 Triagem Hospitalar </h2>
  <button class="btn-abrir-tv"
  onclick="window.open('tv.html','_blank')">📺 Abrir Tela da Tv
  </button>
  </div>

<!--fila de pacientes do Atendimento criada para mostrar quem pode serchamado a TV -->
<div class="pacientes-filas">
  <h3>Paciente Cadastrados no Atendimentos 
    <span>Clique em "Chamar na TV" para chamar ao guichê</span>
  </h3>
  <div id="fila-pacientes">
    <p style="color: #888; text-align: center;">Carregando</p>

  </div>
  <button onclick="carregarPacientes()"
  style="margin-top: 8px;
  background: #8c7574; color: white;
  border: none; padding: 6px
  12px; border-radius: 4px; cursor:pointer;
  font-size: 13px;">🔄️
  Atualizar
  lista
  </button>
</div>

<h2>🏥 Triagem Hospitalar</h2>
<input id="nome" placeholder="Nome">

<select id="sintoma">

<option value="">Selecione</option>
<option value="dor_leve">Dor leve</option>
<option value="resfriado">Resfriado</option>
<option value="coriza">Coriza</option>
<option value="tosse">Tosse</option>
<option value="febre">Febre</option>
<option value="vomito">Vômito</option>
<option value="diarreia">Diarreia</option>
<option value="falta_ar_moderada">Falta de ar moderada</option>
<option value="falta_ar_grave">Falta de ar grave</option>
<option value="infarto">Suspeita de infarto</option>
<option value="avc">Suspeita de AVC</option>
<option value="convulsao">Convulsão</option>
<option value="hemorragia">Hemorragia</option>

</select>

<input
  id="temp"
  type="number"
  placeholder="Temperatura"
/>

<input
  id="alergia"
  placeholder="Alergias"
/>

<textarea
  id="observacao"
  placeholder="Observações"
></textarea>

<div id="resultado"></div>

<button onclick="salvar()">
Salvar Triagem
</button>

</div>

<script>

function classificarRisco(sintoma, temperatura){

  const vermelhos = [
    "infarto",
    "avc",
    "convulsao",
    "hemorragia",
    "falta_ar_grave"
  ];

  const amarelos = [
    "febre",
    "vomito",
    "diarreia",
    "falta_ar_moderada"
  ];

  if (temperatura >= 39) {
    return "vermelho";
  }

  if (vermelhos.includes(sintoma)) {
    return "vermelho";
  }

  if (amarelos.includes(sintoma)) {
    return "amarelo";
  }

  return "verde";
}

function salvar(){

  const nome =
    document.getElementById("nome").value;

  const sintoma =
    document.getElementById("sintoma").value;

  const temperatura =
    Number(document.getElementById("temp").value);

  const alergia =
    document.getElementById("alergia").value;

  const observacao =
    document.getElementById("observacao").value;

  const risco =
    classificarRisco(sintoma, temperatura);

  fetch("http://localhost:3000/triagem", {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body: JSON.stringify({

      nome,
      sintoma,
      temperatura,
      alergia,
      observacao,
      risco

    })

  })

  .then(r => r.json())

  .then(data => {

    const resultado =
      document.getElementById("resultado");

    resultado.className = risco;

    resultado.innerHTML =
      "Classificação: " +
      risco.toUpperCase();

    alert("Triagem salva");

  });

}

</script>

</body>
</html>
