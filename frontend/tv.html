<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TV Hospital</title>

<link rel="stylesheet" href="../css/style.css">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background-color: #5c4033;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.tv-container {
    display: flex;
    width: 95vw;
    height: 90vh;
    gap: 18px;
}

.left-panel {
    display: flex;
    flex-direction: column;
    width: 35%;
    gap: 18px;
}

.right-panel {
    display: flex;
    flex-direction: column;
    width: 65%;
    gap: 18px;
}

.box {
    background-color: aqua;
    border-radius: 15px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.box-title {
    color: white;
    font-size: 2.2vw;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 12px;
}

.local-box {
    flex: 1;
}

.local-number {
    color: red;
    font-size: 9vw;
    font-weight: bold;
}

.local-type {
    color: #5c4033;
    font-size: 1.8vw;
    font-weight: bold;
}

.history-box {
    flex: 1;
    justify-content: flex-start;
}

#history-list {
    list-style: none;
    width: 100%;
    color: red;
    font-size: 1.5vw;
    font-weight: bold;
    text-align: left;
}

#history-list li {
    margin-bottom: 8px;
    padding-bottom: 5px;
    border-bottom: 1px solid rgba(0,0,0,0.3);
}

.patient-box {
    flex: 3;
}

.patient-name {
    color: red;
    font-size: 6.5vw;
    font-weight: bold;
    line-height: 1.2;
    word-break: break-word;
}

.logo-box {
    flex: 1;
}

.logo-text {
    color: palevioletred;
    font-size: 3.5vw;
    font-weight: bold;
    text-transform: uppercase;
}

@keyframes flash {

    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.3;
    }

}

.flash {
    animation: flash 0.5s ease 3;
}

</style>

</head>

<body>

<div class="tv-container">

    <div class="left-panel">

        <div class="box local-box">

            <div
                class="box-title"
                id="local-tipo"
            >
                GUICHÊ
            </div>

            <div
                class="local-number"
                id="local-numero"
            >
                ---
            </div>

        </div>


        <div class="box history-box">

            <div class="box-title">
                ÚLTIMAS CHAMADAS
            </div>

            <ul id="history-list"></ul>

        </div>

    </div>


    <div class="right-panel">

        <div class="box patient-box">

            <div class="box-title">
                PACIENTE
            </div>

            <div
                class="patient-name"
                id="patient-name"
            >
                AGUARDANDO...
            </div>

        </div>


        <div class="box logo-box">

            <div class="logo-text">
                Sistema Hospitalar
            </div>

        </div>

    </div>

</div>


<script>

let ultimaChamada = null;


function atualizar() {

    fetch("/tv/chamada")

        .then(r => r.json())

        .then(data => {

            const chamada = data.chamada;

            const historico =
                data.historico || [];


            if (chamada) {

                document.getElementById(
                    "local-tipo"
                ).innerText =
                    chamada.localTipo ||
                    "GUICHÊ";


                document.getElementById(
                    "local-numero"
                ).innerText =
                    chamada.localNumero ||
                    "--";


                document.getElementById(
                    "patient-name"
                ).innerText =
                    chamada.paciente ||
                    "AGUARDANDO...";


                if (
                    chamada.id !== ultimaChamada
                ) {

                    ultimaChamada =
                        chamada.id;


                    const patientBox =
                        document.querySelector(
                            ".patient-box"
                        );


                    patientBox.classList.remove(
                        "flash"
                    );


                    void patientBox.offsetWidth;


                    patientBox.classList.add(
                        "flash"
                    );

                }

            }


            const list =
                document.getElementById(
                    "history-list"
                );


            list.innerHTML = "";


            historico
                .slice(0, 4)
                .forEach(h => {

                    const li =
                        document.createElement("li");

                    li.textContent =
                        `${h.localTipo || "GUICHÊ"} - ${h.paciente || ""}`;

                    list.appendChild(li);

                });

        })

        .catch(err => {

            console.log(
                "Erro ao buscar chamada:",
                err
            );

        });

}


atualizar();

setInterval(
    atualizar,
    2000
);

</script>

</body>
</html>
