<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Inova Saúde</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="card">

    <img src="logo.png" class="logo" alt="Logo">

    <h1>Bem-vindo</h1>

    <p>Acesso ao sistema do Hospital Inova Saúde</p>

    <form onsubmit="login(); return false;">

        <div class="input-group">
            <input type="text" id="usuario" required>
            <label>Usuário</label>
        </div>

        <div class="input-group">
            <input type="password" id="senha" required>
            <label>Senha</label>
        </div>

        <button type="submit">Entrar</button>

    </form>

    <div class="footer">
        © 2026 Hospital Inova Saúde
    </div>

</div>

<script>

function login() {

    const usuario = document.getElementById("usuario").value.trim();
    const senha = document.getElementById("senha").value.trim();

    fetch("/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            usuario: usuario,
            senha: senha
        })
    })

    .then(response => {

        if (!response.ok) {
            throw new Error("Usuário ou senha inválidos");
        }

        return response.json();

    })

    .then(data => {

        console.log("Login realizado:", data);

        if (data.tipo === "triagem") {

            window.location.href = "triagem.html";

        } else if (data.tipo === "medico") {

            window.location.href = "medico.html";

        } else if (data.tipo === "atendimento") {

            window.location.href = "atendimento.html";

        } else {

            alert("Tipo de usuário inválido.");

        }

    })

    .catch(error => {

        console.error(error);
        alert(error.message);

    });

}

</script>

</body>
</html>
